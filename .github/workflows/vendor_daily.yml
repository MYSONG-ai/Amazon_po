name: Vendor Central Daily Sheet

on:
  workflow_dispatch:

jobs:
  vendor-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Vendor Report
        env:
          SP_LWA_APP_ID: ${{ secrets.IT_SP_LWA_APP_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.IT_SP_LWA_CLIENT_SECRET }}
          SP_REFRESH_TOKEN: ${{ secrets.IT_SP_REFRESH_TOKEN }}
          SP_AWS_ACCESS_KEY: ${{ secrets.IT_SP_AWS_ACCESS_KEY || secrets.SP_AWS_ACCESS_KEY }}
          SP_AWS_SECRET_KEY: ${{ secrets.IT_SP_AWS_SECRET_KEY || secrets.SP_AWS_SECRET_KEY }}
          SP_ROLE_ARN: ${{ secrets.IT_SP_ROLE_ARN || secrets.SP_ROLE_ARN }}
          SP_MARKETPLACE: IT
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          SALES_SPREADSHEET_TOKEN: QYxXsLaONhieXJttq0EcTQXrnlb
          SALES_TV_SHEET_ID: 9b88d3
          SALES_MONITOR_SHEET_ID: ZwTzBK
          FEISHU_VENDOR_CHAT_ID: ${{ secrets.FEISHU_VENDOR_CHAT_ID }}
        run: python vendor_report.py
