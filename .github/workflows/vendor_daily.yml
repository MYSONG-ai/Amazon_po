name: Vendor Central Daily Sheet

on:
  workflow_dispatch:

jobs:
  vendor-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Vendor Report
        env:
          SP_LWA_APP_ID: ${{ secrets.IT_SP_LWA_APP_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.IT_SP_LWA_CLIENT_SECRET }}
          SP_REFRESH_TOKEN: ${{ secrets.IT_SP_REFRESH_TOKEN }}
          SP_AWS_ACCESS_KEY: ${{ secrets.IT_SP_AWS_ACCESS_KEY || secrets.SP_AWS_ACCESS_KEY }}
          SP_AWS_SECRET_KEY: ${{ secrets.IT_SP_AWS_SECRET_KEY || secrets.SP_AWS_SECRET_KEY }}
          SP_ROLE_ARN: ${{ secrets.IT_SP_ROLE_ARN || secrets.SP_ROLE_ARN }}
          SP_MARKETPLACE: IT
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          SALES_SPREADSHEET_TOKEN: DLJMs1Q2Pht7xmtPxmPcmKhCnjd
          SALES_SHEET_ID: ayaBCL
          SALES_HEADER_ROW: '2'
          SALES_DATA_START_ROW: '3'
          SALES_ASIN_COLUMN: '4'
          SALES_FIRST_DATE_COLUMN: '9'
          SALES_TOTAL_ROW: '0'
          FEISHU_VENDOR_CHAT_ID: ${{ secrets.FEISHU_VENDOR_CHAT_ID }}
        run: python vendor_report.py
