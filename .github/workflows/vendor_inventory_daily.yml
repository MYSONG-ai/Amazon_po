name: Vendor Central Daily Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  vendor-inventory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Vendor Inventory Report
        env:
          SP_LWA_APP_ID: ${{ secrets.SP_LWA_APP_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}
          SP_REFRESH_TOKEN: ${{ secrets.SP_REFRESH_TOKEN }}
          SP_AWS_ACCESS_KEY: ${{ secrets.SP_AWS_ACCESS_KEY }}
          SP_AWS_SECRET_KEY: ${{ secrets.SP_AWS_SECRET_KEY }}
          SP_ROLE_ARN: ${{ secrets.SP_ROLE_ARN }}
          SP_MARKETPLACE: DE
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          INVENTORY_BITABLE_APP_TOKEN: ${{ secrets.INVENTORY_BITABLE_APP_TOKEN }}
          INVENTORY_BITABLE_TABLE_ID: ${{ secrets.INVENTORY_BITABLE_TABLE_ID }}
        run: python inventory_report.py
