name: Vendor Central Daily Inventory

on:
  workflow_dispatch:
    inputs:
      debug_raw:
        description: 'Print raw Amazon inventory payload sample'
        required: false
        default: 'false'
      skip_write:
        description: 'Skip writing rows to Feishu spreadsheet'
        required: false
        default: 'false'
  schedule:
    - cron: '0 2 * * *'

jobs:
  vendor-inventory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Vendor Inventory Report
        env:
          SP_LWA_APP_ID: ${{ secrets.SP_LWA_APP_ID }}
          SP_LWA_CLIENT_SECRET: ${{ secrets.SP_LWA_CLIENT_SECRET }}
          SP_REFRESH_TOKEN: ${{ secrets.SP_REFRESH_TOKEN }}
          SP_AWS_ACCESS_KEY: ${{ secrets.SP_AWS_ACCESS_KEY }}
          SP_AWS_SECRET_KEY: ${{ secrets.SP_AWS_SECRET_KEY }}
          SP_ROLE_ARN: ${{ secrets.SP_ROLE_ARN }}
          SP_MARKETPLACE: DE
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          INVENTORY_SPREADSHEET_TOKEN: ${{ secrets.INVENTORY_SPREADSHEET_TOKEN }}
          INVENTORY_SHEET_ID: ${{ secrets.INVENTORY_SHEET_ID }}
          INVENTORY_DEBUG_RAW: ${{ github.event.inputs.debug_raw == 'true' && '1' || '' }}
          INVENTORY_SKIP_WRITE: ${{ github.event.inputs.skip_write == 'true' && '1' || '' }}
        run: python inventory_report.py
